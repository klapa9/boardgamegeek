<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Offline | My Games — Vermeulen Games</title>
    <style>
      :root {
        color-scheme: light;
        --navy: #14213D;
        --cream: #FFF7EA;
        --sun: #FFC857;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--navy);
        font-family: "Nunito Sans", system-ui, sans-serif;
      }

      main {
        width: min(100%, 28rem);
        border: 2px solid var(--navy);
        border-radius: 24px;
        background: var(--cream);
        padding: 28px;
        box-shadow: 0 6px 0 var(--sun);
        text-align: center;
      }

      img {
        width: 72px;
        height: 72px;
        border-radius: 50%;
      }

      h1 {
        margin: 12px 0;
        color: var(--navy);
        font-size: 2rem;
      }

      p {
        margin: 0;
        color: #36425e;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192x192.png" alt="" />
      <h1>Je bent offline</h1>
      <p><strong>My Games</strong> kon de nieuwste gegevens niet laden. Zodra je opnieuw verbinding hebt, werkt alles weer normaal.</p>
    </main>
  </body>
</html>
